<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — R3za22</title>
  <!-- DESIGN PASS: same stylesheet as index.html; restyle freely, keep ids -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="section">
    <nav aria-label="Site sections">
      <a href="index.html">&larr; Back to portfolio</a>
    </nav>
    <h1 id="profile-name"></h1>
    <p id="profile-title"></p>
    <p>
      <a id="resume-pdf-link" href="assets/resume.pdf" download>Download PDF</a>
    </p>
  </header>

  <main>
    <section id="resume-summary" class="section">
      <h2>Summary</h2>
      <p id="resume-summary-text"></p>
    </section>

    <section id="resume-experience" class="section">
      <h2>Experience</h2>
      <div id="experience-list">
        <!-- entries injected by js/main.js -->
      </div>
    </section>

    <section id="resume-education" class="section">
      <h2>Education</h2>
      <div id="education-list">
        <!-- entries injected by js/main.js -->
      </div>
    </section>

    <section id="resume-languages" class="section">
      <h2>Languages</h2>
      <ul id="languages-list">
        <!-- entries injected by js/main.js -->
      </ul>
    </section>

    <section id="resume-skills" class="section">
      <h2>Skills</h2>
      <div id="skills-groups" class="card-grid">
        <!-- skill groups injected by js/main.js -->
      </div>
    </section>
  </main>

  <template id="tpl-resume-entry">
    <article class="resume-entry">
      <h3 class="re-heading"></h3>
      <p class="re-period"></p>
      <ul class="re-points"></ul>
    </article>
  </template>

  <script src="js/main.js"></script>
</body>
</html>

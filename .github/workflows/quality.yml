name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub ubuntu runners ship Chrome preinstalled; lhci finds it on PATH.
      - run: npx lhci autorun
      # Skip external hosts only; keep the local server (localhost / 127.0.0.1) crawled.
      - run: npx linkinator dist --recurse --skip '^https?://(?!localhost|127\.0\.0\.1)'

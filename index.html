<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reza Ghamar — Mobile & Full-Stack Developer</title>
  <meta name="description" content="Portfolio: Android (Kotlin/Compose, React Native), full-stack web, and tooling projects.">
  <!-- Kinetic design (from Claude Design project "Portfolio - Kinetic"), wired to
       content.json via js/main.js. See DESIGN_HANDOFF.md for the render contract. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ NAV / HERO ============ -->
  <header id="hero">
    <span id="brand">RG&copy;</span>
    <nav id="site-nav" aria-label="Site sections">
      <a href="#projects">PROJECTS</a>
      <a href="#android-apps">ANDROID</a>
      <a href="#skills">SKILLS</a>
      <a href="resume.html">RESUME &#8599;</a>
    </nav>
  </header>

  <div id="hero-content">
    <div>
      <img id="headshot" src="assets/headshot.jpg" alt="" hidden>
      <div class="hero-line"><div id="hero-first" class="hero-name rise-in"></div></div>
      <div class="hero-line"><div id="hero-rest" class="hero-name outline rise-in" style="animation-delay:.12s"><span class="dot">.</span></div></div>

      <div id="hero-meta">
        <p id="profile-bio" class="rise-in" style="animation-delay:.28s"></p>
        <p id="hero-locale" class="rise-in" style="animation-delay:.36s"></p>
      </div>

      <div id="hero-cta" class="rise-in" style="animation-delay:.44s">
        <a class="primary" href="#projects">SEE THE WORK &#8595;</a>
        <a id="hero-github" class="secondary" href="https://github.com/R3za22" target="_blank" rel="noopener">GITHUB &#8599;</a>
      </div>
    </div>

    <div id="marquee-wrap">
      <div id="marquee-track"><!-- filled by js/main.js --></div>
    </div>
  </div>

  <main>
    <!-- ============ PROJECTS ============ -->
    <section id="projects">
      <div id="projects-head">
        <span class="section-label">01 &mdash; SELECTED WORK</span>
        <span class="years">2022&ndash;2026</span>
      </div>
      <div id="project-grid">
        <!-- project rows injected by js/main.js -->
      </div>
    </section>

    <!-- ============ ANDROID APPS ============ -->
    <section id="android-apps">
      <span class="section-label">02 &mdash; ON DEVICE</span>
      <div id="android-list">
        <!-- phone frames + copy block injected by js/main.js -->
      </div>
    </section>

    <!-- ============ SKILLS ============ -->
    <section id="skills">
      <span class="section-label">03 &mdash; STACK</span>
      <div id="skills-groups" data-reveal>
        <!-- skill groups injected by js/main.js -->
      </div>
    </section>

    <!-- ============ RESUME TEASER ============ -->
    <a id="resume-teaser" href="resume.html" data-reveal>
      <span class="section-label">04 &mdash; RESUME</span>
      <div id="resume-teaser-inner">
        <span class="big">FULL HISTORY &rarr;</span>
        <p>Experience, education, languages &mdash; on one quiet, printable page. PDF included.</p>
      </div>
    </a>
  </main>

  <footer>
    <p id="footer-line"></p>
    <div id="footer-links"><!-- filled by js/main.js --></div>
  </footer>

  <!-- templates used by js/main.js -->
  <template id="tpl-project-row">
    <a class="pc-row" data-reveal>
      <span class="pc-index"></span>
      <span class="pc-name"><span class="pc-name-text"></span><span class="pc-flag" hidden>&#9733; FLAGSHIP</span></span>
      <span class="pc-tagline"></span>
      <span class="pc-tag"></span>
    </a>
  </template>

  <template id="tpl-android-frame">
    <div class="ac-frame" data-reveal>
      <div class="ac-screen"></div>
    </div>
  </template>

  <script src="js/main.js"></script>
</body>
</html>

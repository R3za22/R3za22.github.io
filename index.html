<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — R3za22</title>
  <meta name="description" content="Portfolio: Android (Kotlin/Compose, React Native), full-stack web, and tooling projects.">
  <!-- DESIGN PASS: replace css/style.css with Claude Design output. Markup below is
       semantic and data-driven (js/main.js + content.json) — restyle freely, but keep
       element ids and data-* attributes, the JS targets them. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ HERO / ABOUT ============ -->
  <header id="hero" class="section">
    <!-- DESIGN PASS: hero layout, headshot slot below -->
    <img id="headshot" src="assets/headshot.jpg" alt="" hidden>
    <h1 id="profile-name"><!-- filled from content.json --></h1>
    <p id="profile-title"></p>
    <p id="profile-bio"></p>
    <nav id="profile-links" aria-label="Contact links">
      <!-- anchors injected: GitHub, LinkedIn, email -->
    </nav>
    <nav id="site-nav" aria-label="Site sections">
      <a href="#projects">Projects</a>
      <a href="#android-apps">Android Apps</a>
      <a href="#skills">Skills</a>
      <a href="resume.html">Resume</a>
    </nav>
  </header>

  <main>
    <!-- ============ PROJECTS ============ -->
    <section id="projects" class="section">
      <h2>Projects</h2>
      <div id="project-grid" class="card-grid">
        <!-- project cards injected by js/main.js — template below -->
      </div>
    </section>

    <!-- ============ ANDROID APPS ============ -->
    <section id="android-apps" class="section">
      <h2>Android Apps</h2>
      <div id="android-list">
        <!-- android app cards (with screenshot strips) injected by js/main.js -->
      </div>
    </section>

    <!-- ============ SKILLS ============ -->
    <section id="skills" class="section">
      <h2>Skills</h2>
      <div id="skills-groups" class="card-grid">
        <!-- skill groups injected by js/main.js -->
      </div>
    </section>

    <!-- ============ RESUME TEASER ============ -->
    <section id="resume-teaser" class="section">
      <h2>Resume</h2>
      <p>Full work history and education on the <a href="resume.html">resume page</a>,
         or <a id="resume-pdf-link" href="assets/resume.pdf" download>download the PDF</a>.</p>
    </section>
  </main>

  <footer class="section">
    <p id="footer-line"></p>
  </footer>

  <!-- templates used by js/main.js -->
  <template id="tpl-project-card">
    <article class="project-card">
      <h3 class="pc-name"></h3>
      <p class="pc-tagline"></p>
      <p class="pc-desc"></p>
      <ul class="pc-highlights"></ul>
      <ul class="pc-tech" aria-label="Tech stack"></ul>
      <p class="pc-stats" hidden><span class="pc-stars"></span> <span class="pc-lang"></span></p>
      <nav class="pc-links"></nav>
    </article>
  </template>

  <template id="tpl-android-card">
    <article class="android-card">
      <h3 class="ac-name"></h3>
      <p class="ac-tagline"></p>
      <div class="ac-screenshots">
        <!-- screenshot <img> or placeholder boxes injected -->
      </div>
      <p class="ac-desc"></p>
      <ul class="ac-highlights"></ul>
      <ul class="ac-tech" aria-label="Tech stack"></ul>
      <nav class="ac-links"></nav>
    </article>
  </template>

  <script src="js/main.js"></script>
</body>
</html>
